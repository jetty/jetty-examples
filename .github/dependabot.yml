version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "maven"
    directory: "/"
    target-branch: "12.0.x"
    schedule:
      interval: "daily"
    ignore:
      # Do not upgrade major versions of dependencies
      - dependency-name: "*"
        update-types: [ "version-update:semver-major" ]
      - dependency-name: "org.eclipse.jetty:*"
        update-types: [ "version-update:semver-patch" ]
      # Restrict updates in this branch to jetty in the 12.0.x space
      - dependency-name: "org.jboss.weld.servlet:*"
        update-types: [ "version-update:semver-minor" ]
      - dependency-name: "jakarta.websocket:*"
      - dependency-name: "jakarta.servlet:*"
      - dependency-name: "jakarta.servlet.jsp:*"

  - package-ecosystem: "maven"
    directory: "/"
    target-branch: "12.1.x"
    schedule:
      interval: "daily"
    ignore:
      # Do not upgrade major versions of dependencies
      - dependency-name: "*"
        update-types: [ "version-update:semver-major" ]
      # Restrict updates in this branch to jetty in the 12.1.x space
      - dependency-name: "org.eclipse.jetty:*"
        update-types: [ "version-update:semver-patch" ]
      - dependency-name: "org.jboss.weld.servlet:*"
        update-types: [ "version-update:semver-minor" ]
      - dependency-name: "jakarta.websocket:*"
      - dependency-name: "jakarta.servlet:*"
      - dependency-name: "jakarta.servlet.jsp:*"
